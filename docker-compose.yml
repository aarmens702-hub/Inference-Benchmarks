services:
  inferbench:
    build: .
    image: inferbench:dev
    container_name: inferbench
    ports:
      - "8000:7860"
    volumes:
      # Overlay the local models dir on top of the baked-in copy so re-export
      # picks up without rebuilding the image. Comment out for parity with HF.
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
    environment:
      INFERBENCH_CONFIG: /app/configs/server.yaml
      PORT: "7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health').read()"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 15s
    restart: unless-stopped
