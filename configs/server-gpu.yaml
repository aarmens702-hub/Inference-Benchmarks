# InferBench server configuration — GPU profile (CUDA EP).
#
# Activate with: INFERBENCH_CONFIG=configs/server-gpu.yaml make serve
# Requires: onnxruntime-gpu installed and CUDA 12.x runtime visible to the
# process. See docs/HARDWARE.md for the exact reproducible setup on
# NVIDIA RTX A2000 ADA (16 GB).
#
# Three models are registered side-by-side so /demo and the benchmark
# harness can compare FP32, FP16, and INT8 dynamic on the same hardware.

server:
  host: 0.0.0.0
  port: 8000
  log_level: info

models:
  - name: fp32
    path: models/distilbert-sst2-fp32
    precision: fp32
    backend: onnxruntime-cuda
  - name: fp16
    path: models/distilbert-sst2-fp16
    precision: fp16
    backend: onnxruntime-cuda
  - name: int8
    path: models/distilbert-sst2-int8
    precision: int8-dynamic
    backend: onnxruntime-cuda

batching:
  enabled: true
  max_batch_size: 32           # GPU can absorb larger batches than CPU
  max_wait_ms: 5

queue:
  max_size: 2048
  request_timeout_ms: 5000

cache:
  enabled: true
  max_entries: 8192

controller:
  enabled: false
  latency_slo_ms: 50
  min_batch_size: 1
  max_batch_size: 64
  adjust_interval_sec: 5

rate_limit:
  enabled: false               # benchmarks need to push past the 30/min CPU cap

demo:
  enabled: true
