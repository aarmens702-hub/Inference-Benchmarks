# InferBench server configuration.
# Loaded by inferbench.server.app at startup.
#
# Defaults below are the recommended out-of-the-box setup, validated by
# the committed benchmarks under results/. To explore other regimes:
#
#   - Faster + smaller, slight accuracy loss:
#       model.path: models/distilbert-sst2-int8
#       model.precision: int8-dynamic
#     (run `make quantize-model` first; tradeoff in results/quant_tradeoff/)
#
#   - GPU / CoreML / TensorRT: see docs/BACKENDS.md
#
#   - Adaptive batching demo: controller.enabled=true (works best at
#     moderate load; can regress at saturation, see TRADEOFFS.md §6)

server:
  host: 0.0.0.0
  port: 8000
  log_level: info

model:
  name: distilbert-sst2
  path: models/distilbert-sst2-fp32
  precision: fp32             # fp32 | int8-dynamic | int8-static
  backend: onnxruntime-cpu    # cpu | cuda | coreml | tensorrt — see docs/BACKENDS.md

batching:
  enabled: true               # dynamic batching across HTTP requests
  max_batch_size: 16
  max_wait_ms: 10

queue:
  max_size: 1024              # backpressure: put_nowait fails with 429 above this
  request_timeout_ms: 5000    # asyncio.wait_for returns 504 after this

cache:
  enabled: true               # LRU prediction cache, sub-ms hits
  max_entries: 4096

controller:
  enabled: false              # opt-in adaptive batcher (see docs/TRADEOFFS.md §6)
  latency_slo_ms: 100
  min_batch_size: 1
  max_batch_size: 32
  adjust_interval_sec: 5
