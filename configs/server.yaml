# InferBench server configuration.
# Loaded by inferbench.server.app at startup.
#
# Multiple models can be served from the same process. The first model
# in `models:` is the default for /infer (without a name). /infer/{name}
# routes to a specific model. Demo at /demo posts to both.
#
# Single-model config (legacy) still works: a top-level `model:` block
# is treated as a 1-entry models list named "default".

server:
  host: 0.0.0.0
  port: 8000
  log_level: info

models:
  - name: fp32
    path: models/distilbert-sst2-fp32
    precision: fp32
    backend: onnxruntime-cpu
  - name: int8
    path: models/distilbert-sst2-int8
    precision: int8-dynamic
    backend: onnxruntime-cpu

batching:
  enabled: true               # dynamic batching across HTTP requests
  max_batch_size: 16
  max_wait_ms: 10

queue:
  max_size: 1024              # backpressure: put_nowait fails with 429 above this
  request_timeout_ms: 5000    # asyncio.wait_for returns 504 after this

cache:
  enabled: true               # LRU prediction cache, sub-ms hits
  max_entries: 4096

controller:
  enabled: false              # opt-in adaptive batcher (see docs/TRADEOFFS.md §6)
  latency_slo_ms: 100
  min_batch_size: 1
  max_batch_size: 32
  adjust_interval_sec: 5

# rate limit applied to /infer* (slowapi, per-IP). Format: "N/period".
rate_limit:
  enabled: true
  infer: "30/minute"

# admin endpoints require Authorization: Bearer $INFERBENCH_ADMIN_TOKEN.
# if the env var is unset, /admin/* returns 503.
