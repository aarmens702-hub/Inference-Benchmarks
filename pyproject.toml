[project]
name = "inferbench"
version = "0.1.0"
description = "Local inference-serving benchmark framework: dynamic batching, quantization, caching, adaptive batching, and p50/p95/p99 reporting on ONNX Runtime."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Aarmen Sidhu" }]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "onnxruntime>=1.17,<2.0",
    "numpy>=1.26,<3.0",
    "pyyaml>=6.0,<7.0",
    "psutil>=5.9,<7.0",
    "matplotlib>=3.8,<4.0",
    "httpx>=0.27,<1.0",
    "onnx>=1.15,<2.0",
    "transformers>=4.40,<5.0",
    "optimum[onnxruntime]>=1.20,<2.0",
    "torch>=2.2,<2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "ruff>=0.3,<1.0",
]
gpu = [
    "onnxruntime-gpu>=1.17,<2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["inferbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
